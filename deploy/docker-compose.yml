# Local development stack: docker compose -f deploy/docker-compose.yml up --build
# Web app: http://localhost:3000  API: http://localhost:8000  Emails: http://localhost:8025
name: corpsec

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: corpsec-api:dev
  environment:
    CORPSEC_DATABASE_URL: postgresql+asyncpg://corpsec:corpsec@postgres:5432/corpsec
    CORPSEC_REDIS_URL: redis://redis:6379/0
    CORPSEC_INTEL_PATH: /data/intel.json
    CORPSEC_WEB_URL: http://localhost:3000
    # Development mail catcher: read sign-in links and alerts at http://localhost:8025
    CORPSEC_SMTP_HOST: mailpit
    CORPSEC_SMTP_PORT: "1025"
    CORPSEC_SMTP_STARTTLS: "false"
  volumes:
    - intel:/data

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corpsec
      POSTGRES_PASSWORD: corpsec
      POSTGRES_DB: corpsec
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "corpsec"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["127.0.0.1:8025:8025"]

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  intel-sync:
    <<: *app
    # Fills the intel volume once at startup. In production run it nightly (M4 scheduler).
    command: ["corpsec-intel-sync", "--out", "/data/intel.json", "--previous", "/data/intel.json"]
    environment:
      # Optional: WordPress vulnerabilities from Wordfence. Put it in deploy/.env (gitignored).
      CORPSEC_WORDFENCE_API_KEY: ${CORPSEC_WORDFENCE_API_KEY:-}
    user: root
    restart: "no"

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: ["arq", "corpsec_api.worker.WorkerSettings"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      # Not waited for: the worker picks the snapshot up whenever the file appears.
      intel-sync: { condition: service_started }

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        CORPSEC_API_URL: http://api:8000
    image: corpsec-web:dev
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  intel:
