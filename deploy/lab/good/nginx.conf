server {
    listen 80;
    server_name corpsec-lab-good.com www.corpsec-lab-good.com;
    return 301 https://corpsec-lab-good.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.corpsec-lab-good.com;
    ssl_certificate     /certs/good.crt;
    ssl_certificate_key /certs/good.key;
    return 301 https://corpsec-lab-good.com$request_uri;
}

server {
    listen 443 ssl;
    server_name corpsec-lab-good.com;

    ssl_certificate     /certs/good.crt;
    ssl_certificate_key /certs/good.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    root /srv/www;
    index index.html;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Set-Cookie "session=lab0123456789; Path=/; Secure; HttpOnly; SameSite=Lax" always;

    location = /.well-known/security.txt { default_type text/plain; }
}
