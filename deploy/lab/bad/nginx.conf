# Deliberately insecure. Do not copy.
server {
    listen 80;
    listen 443 ssl;
    server_name corpsec-lab-bad.com www.corpsec-lab-bad.com;

    ssl_certificate     /certs/bad.crt;
    ssl_certificate_key /certs/bad.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ALL:@SECLEVEL=0;

    server_tokens on;
    root /srv/www;
    index index.html;

    add_header X-Powered-By "PHP/7.4.3" always;
    add_header Set-Cookie "PHPSESSID=lab0123456789; path=/" always;
    # Reflects any Origin with credentials (CORS-001)
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;

    location /files/ { autoindex on; }
    location = /oops { default_type text/html; }
    location = /phpinfo.php { default_type text/html; }
    location = /xmlrpc.php {
        default_type text/plain;
        return 405 "XML-RPC server accepts POST requests only.";
    }
    location = /wp-json/wp/v2/users { default_type application/json; }
    location ~ ^/(\.env|\.git/HEAD|backup\.sql|wp-content/debug\.log)$ { default_type text/plain; }
}
