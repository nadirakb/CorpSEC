[project]
name = "corpsec-intel"
version = "0.1.0"
description = "Builds the CorpSEC vulnerability/product intelligence snapshot"
requires-python = ">=3.12"
dependencies = ["corpsec-scanner", "httpx>=0.28"]

[project.scripts]
corpsec-intel-sync = "corpsec_intel.sync:main"

[tool.uv.sources]
corpsec-scanner = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
