check_id: SW-005
title: "Your site uses an old code library with known holes"
pass_title: "Your site's code libraries have no known holes"
summary: "Your pages load {{product|a code library}} {{version}}, which has known security holes."
why_it_matters:
  - "Some of these holes let attackers run their own code in your visitors' browsers."
fix:
  default:
    - "Ask your web designer to update {{product|the library}} to the newest version."
    - "Test the site afterwards, since big updates can change how pages work."
