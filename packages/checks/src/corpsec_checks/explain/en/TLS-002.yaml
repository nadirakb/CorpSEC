check_id: TLS-002
title: "Your security certificate expires very soon"
pass_title: "Your security certificate is not about to expire"
summary: "The certificate for {{host}} runs out in {{days_left|a few}} days. After that, visitors will see a security warning."
analogy: "It is like a passport that is about to expire."
why_it_matters:
  - "When it expires, browsers block your site with a warning."
  - "Shops and booking forms stop working until it is renewed."
