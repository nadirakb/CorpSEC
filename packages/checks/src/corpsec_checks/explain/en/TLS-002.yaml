  default:
    - "Log in to your web host and open the SSL or Security section."
    - "Renew the certificate now."
    - "Turn on automatic renewal so this does not happen again."
  hosted:
    - "{{platform_name|Your website builder}} renews certificates for you."
    - "Check that your domain is still connected and your plan is active."
    - "If the date does not change within a day, contact their support."
effort_minutes: 15
who_can_fix: "Your web host."
technical: "Certificate notAfter in {{days_left|?}} days."
variables: [days_left]
