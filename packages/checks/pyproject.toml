[project]
name = "corpsec-checks"
version = "0.1.0"
description = "CorpSEC check catalog"
requires-python = ">=3.12"
dependencies = ["corpsec-scanner"]

[project.entry-points."corpsec.checks"]
catalog = "corpsec_checks:CHECKS"

[tool.uv.sources]
corpsec-scanner = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
