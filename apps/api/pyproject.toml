[project]
name = "corpsec-api"
version = "0.1.0"
description = "CorpSEC HTTP API and scan worker"
requires-python = ">=3.12"
dependencies = [
    "corpsec-scanner",
    "corpsec-checks",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "arq>=0.26",
    "pydantic-settings>=2.6",
]

[tool.uv.sources]
corpsec-scanner = { workspace = true }
corpsec-checks = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
