name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corpsec
          POSTGRES_PASSWORD: corpsec
          POSTGRES_DB: corpsec_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corpsec"
          --health-interval 2s
          --health-retries 30
    env:
      CORPSEC_TEST_DATABASE_URL: postgresql+asyncpg://corpsec:corpsec@localhost:5432/corpsec_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --locked
      - run: uv run pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t corpsec-api:ci .
      - run: docker build -f deploy/web.Dockerfile -t corpsec-web:ci .

  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lab
        run: docker compose -f deploy/lab/compose.yml build
      - name: Start lab sites
        run: docker compose -f deploy/lab/compose.yml up -d --wait dns bad good self
      - name: Scan lab sites
        run: docker compose -f deploy/lab/compose.yml run --rm runner
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/lab/compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f deploy/lab/compose.yml down -v
